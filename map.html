<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Map · Dreamstate SoCal 2026</title><meta name="robots" content="noindex">
<meta property="og:type" content="website"><meta property="og:title" content="Dreamstate SoCal 2026 · Festival Map"><meta property="og:image" content="https://dreamstate26.thegameday.zone/og.jpg"><meta property="og:url" content="https://dreamstate26.thegameday.zone/map.html"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#121217">
<style>
:root{--bg:#fff;--fg:#141414;--mut:#5c5c66;--line:#e4e4ea;--sh:#f4f4f8;--acc:#6b3fd4}
body.dark{--bg:#121217;--fg:#ececf1;--mut:#a0a0ad;--line:#2a2a33;--sh:#1c1c24;--acc:#b49cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,sans-serif}
header{padding:calc(16px + env(safe-area-inset-top)) 14px 6px}
.nav{display:flex;gap:6px;margin:0 0 14px}.nav a{font-size:13.5px;font-weight:700;text-decoration:none;color:var(--fg);padding:7px 13px;border-radius:16px;border:1px solid var(--line);background:var(--sh)}.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.logo{height:44px;display:block;margin:0 auto 6px}body.dark .logo{filter:invert(1)}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px}
.wrap{margin:10px 8px;overflow:auto;border-radius:14px;-webkit-overflow-scrolling:touch}
.wrap img{display:block;width:100%;border-radius:14px;cursor:zoom-in}.wrap.z img{width:220%;max-width:none;cursor:zoom-out}
.btn{font:inherit;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sh);color:var(--fg);font-size:13px}
.row{display:flex;gap:6px;padding:4px 14px}
footer{color:var(--mut);font-size:12px;padding:20px 14px}
header h1{text-align:center}</style></head><body>
<header><nav class="nav"><a href="./">Playlists</a><a href="settimes.html">Set Times</a><a class="on" href="map.html">Map</a></nav>
<img class="logo" src="logo.png" alt="Dreamstate"><h1>Festival Map</h1><div class="sub">Queen Mary Waterfront, Long Beach. Tap the map to zoom in, then drag to move around.</div></header>
<div class="row"><button class="btn" id="zb">Zoom in</button><a class="btn" href="map.jpg" target="_blank" rel="noopener" style="text-decoration:none">Open full image</a><button class="btn" id="dm">Light</button></div>
<div class="wrap" id="w"><img src="map.jpg" alt="Dreamstate SoCal 2026 festival map: Sequence stage by the festival entrance, then Void, Vision, and Dream stage by the Queen Mary"></div>
<footer>Map from the official Dreamstate SoCal 2026 materials. Fan-made page, not affiliated with Dreamstate or Insomniac.<div style="margin-top:8px">William A.</div></footer>
<script>
const w=document.getElementById('w'),zb=document.getElementById('zb');
function z(){const on=w.classList.toggle('z');zb.textContent=on?'Zoom out':'Zoom in'}
w.querySelector('img').onclick=z;zb.onclick=z;
document.body.classList.add('dark');try{if(localStorage.getItem('ds26dark')==='0')document.body.classList.remove('dark')}catch(e){}
const dm=document.getElementById('dm');dm.textContent=document.body.classList.contains('dark')?'Light':'Dark';
dm.onclick=()=>{const d=document.body.classList.toggle('dark');dm.textContent=d?'Light':'Dark';try{localStorage.setItem('ds26dark',d?'1':'0')}catch(x){}};
</script></body></html>
