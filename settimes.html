<style>
:root{--bg:#fff;--fg:#141414;--mut:#5c5c66;--line:#e4e4ea;--sh:#f4f4f8;--acc:#6b3fd4;--grid:#d9d9e3}
body.dark{--bg:#121217;--fg:#ececf1;--mut:#a0a0ad;--line:#2a2a33;--sh:#1c1c24;--acc:#b49cff;--grid:#2c2c38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{padding:calc(16px + env(safe-area-inset-top)) 14px 6px}
.nav{display:flex;gap:6px;margin:0 0 14px}.nav a{font-size:13.5px;font-weight:700;text-decoration:none;color:var(--fg);padding:7px 13px;border-radius:16px;border:1px solid var(--line);background:var(--sh)}.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.logo{height:44px;display:block;margin:0 auto 6px}body.dark .logo{filter:invert(1)}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;padding:10px 14px 4px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sh);color:var(--fg);font-size:13px}.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sp{flex:1}
.grid{position:relative;margin:8px 10px 0 0;display:grid;grid-template-columns:44px repeat(4,1fr);column-gap:3px}
.hd{font-size:10.5px;font-weight:800;text-align:center;letter-spacing:.3px;padding:6px 0;position:sticky;top:0;background:var(--bg);z-index:3}
.axis,.col{margin-top:8px}.col{position:relative;background:repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 78px);border-bottom:1px solid var(--grid)}.axis{position:relative}
.tl{position:absolute;right:4px;font-size:10px;color:var(--mut);transform:translateY(-50%);white-space:nowrap}
.hl{position:absolute;left:44px;right:0;border-top:1px solid var(--grid)}
.set{position:absolute;left:0;right:0;border-radius:8px;padding:4px 3px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;cursor:pointer;border:0;font:inherit;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.set b{font-size:11px;line-height:1.15;font-weight:800;text-transform:uppercase;word-break:break-word}.set small{font-size:9.5px;opacity:.9;margin-top:2px;font-weight:600}
.set .n{position:absolute;bottom:3px;right:5px;font-size:9px;opacity:.85;font-weight:700}
.set .st{position:absolute;top:2px;right:4px;font-size:13px;display:none}
.set.fav{box-shadow:inset 0 0 0 3px #ffd84d}.set.fav .st{display:block}
.set.dim{opacity:.28}
.Dream{background:#2fb3d1}.Sequence{background:#e3962e}.Void{background:#3a6fd8}.Vision{background:#d062d6}
.plan{margin:22px 14px 0}.plan h2{font-size:17px;margin:0 0 8px}.pi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.pt{font-weight:650}.pm{color:var(--mut);font-size:12.5px}.warn{color:#ff7a59;font-size:12px;font-weight:600}
.empty{color:var(--mut);font-size:13.5px}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(70px + env(safe-area-inset-top));background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);z-index:10;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.on{transform:none}
.shd{padding:16px 16px 10px;border-bottom:1px solid var(--line);position:relative}
.shd .bar{height:5px;width:40px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
.shd h3{margin:0;font-size:20px;padding-right:44px}.shd .meta{color:var(--mut);font-size:13px;margin-top:3px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--sh);color:var(--fg);font-size:17px}
.fv{margin-top:10px;padding:9px 14px;border-radius:18px;border:1px solid #e6b800;background:transparent;color:var(--fg);font:inherit;font-weight:700;font-size:14px}.fv.on{background:#ffd84d;color:#222;border-color:#ffd84d}
.list{overflow-y:auto;padding:4px 16px 100px;-webkit-overflow-scrolling:touch}
.song{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.art{width:48px;height:48px;color:transparent;border-radius:7px;background:var(--sh);flex:none;object-fit:cover}
.mid{flex:1;min-width:0}.ti{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ar{color:var(--mut);font-size:12px}
.lk{display:flex;gap:6px;margin-top:4px}.lk a{font-size:11px;font-weight:600;text-decoration:none;padding:2px 8px;border-radius:10px;color:#fff}.am{background:#fa2d48}.spt{background:#1db954;color:#0b2414!important}
.tag{font-size:10.5px;padding:0 6px;border-radius:9px;border:1px solid var(--acc);color:var(--acc);margin-left:3px}
.play{width:40px;height:40px;border-radius:50%;border:0;background:#f0525f;flex:none;display:grid;place-items:center}.play svg{width:16px;height:16px;fill:#fff}.play[disabled]{background:var(--line)}.play.on{background:var(--acc)}
.mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#2b1630;color:#fff;border-radius:16px;padding:9px 12px;display:none;gap:10px;align-items:center;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.mini img{width:40px;height:40px;border-radius:7px}.mini .mt{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini .mt span{display:block;font-weight:400;opacity:.7;font-size:12px}
.mini button{background:none;border:0;color:#fff;font-size:18px}
footer{color:var(--mut);font-size:12px;padding:24px 14px}
header h1{text-align:center}</style></head><body>
<header><nav class="nav"><a href="./">Playlists</a><a class="on" href="settimes.html">Set Times</a><a href="map.html">Map</a></nav>
<img class="logo" src="logo.png" alt="Dreamstate"><h1>Set Times</h1>
<div class="sub">Tap a set to hear its tracks. Tap ☆ to add it to your plan; your picks stay saved on this phone.</div></header>
<div class="tabs"><button class="btn on" data-d="Fri">Fri 11/20</button><button class="btn" data-d="Sat">Sat 11/21</button><span class="sp"></span><button class="btn" id="mine">★ My sets only</button><button class="btn" id="dm">Light</button></div>
<div class="grid" id="g"></div>
<section class="plan"><h2>My plan · <span id="pd"></span></h2><div id="pl"></div></section>
<footer>Set times from the official Dreamstate SoCal 2026 schedule. Fan-made page, not affiliated with Dreamstate or Insomniac.<div style="margin-top:8px">William A.</div></footer>
<div class="sheet" id="sh"><div class="shd"><div class="bar"></div><button class="x" id="sx" aria-label="Close">✕</button><h3 id="stt"></h3><div class="meta" id="stm"></div><button class="fv" id="sfv">☆ I want to see this</button></div><div class="list" id="sl"></div></div>
<div class="mini" id="mini"><img id="mimg" alt=""><div class="mt" id="mt"></div><button id="mpp" aria-label="Play or pause">⏸</button><button id="mx" aria-label="Close">✕</button></div>
<audio id="au" preload="none"></audio>
<script src="data.js"></script>
<script>
const AM='https://music.apple.com/us/',AU='https://audio-ssl.itunes.apple.com/',IM='https://is1-ssl.mzstatic.com/image/thumb/';
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const STG=['Dream','Sequence','Void','Vision'];
// [stage, start, end (hours, 24h; 25 = 1am), display name, note, slot key in data]
const S={Fri:[
['Dream',16,17,'VisionV','','VisionV'],['Dream',17,18,'Matty Ralph','','Matty Ralph'],['Dream',18,19,'David Rust + Olly James','','David Rust + Olly James'],['Dream',19,20,'The Rocketman','','The Rocketman'],['Dream',20,21,'Marlo','','Marlo'],['Dream',21,22,'Andrew Rayel','pres Extasia','Andrew Rayel'],['Dream',22,23,'Dash Berlin','','Dash Berlin'],['Dream',23,24,'Hannah Laing + Marie Vaunt','','Hannah Laing + Marie Vaunt'],['Dream',24,25,'ARTBAT','','ARTBAT'],
['Sequence',16,17,'Maximizer','','Maximizer'],['Sequence',17,18,'Terra','','Terra'],['Sequence',18,19,'Kaufmann','','Kaufmann'],['Sequence',19,20,'Burn In Noise','','Burn In Noise'],['Sequence',20,21,'GMS','','GMS'],['Sequence',21,22,'Phaxe','','Phaxe'],['Sequence',22,23,'Astrix','','Astrix'],['Sequence',23,24,'Neelix','','Neelix'],['Sequence',24,25,'Infected Mushroom','','Infected Mushroom'],
['Void',16,17,'Shay De Castro','','Shay De Castro'],['Void',17,18,'BK','','BK'],['Void',18,19,'Lee Ann Roberts','','Lee Ann Roberts'],['Void',19,20,'A.N.I.','','A.N.I.'],['Void',20,21,'Schrotthagen','','Schrotthagen'],['Void',21,22,'Panteros666','','Panteros666'],['Void',22,23,'Pegassi','','Pegassi'],['Void',23,24,'Enrico Sangiuliano','','Enrico Sangiuliano'],['Void',24,25,'Reinier Zonneveld','(live)','Reinier Zonneveld'],
['Vision',16,17,'Karmå','','Karmå'],['Vision',17,18,'Steve Dekay','','Steve Dekay'],['Vision',18,19,'Frankyeffe','','Frankyeffe'],['Vision',19,20,'Mirage','(live)','Mirage'],['Vision',20,21,'NRG2000','','NRG2000'],['Vision',21,22,'Warp Brothers','','Warp Brothers'],['Vision',22,23,'Mauro Picotto','','Mauro Picotto'],['Vision',23,24,'BT','','BT'],['Vision',24,25,'Marco V','','Marco V']],
Sat:[
['Dream',16,17,'Das Pharaoh','','Das Pharaoh'],['Dream',17,18,'TH;EN','','TH;EN'],['Dream',18,19,'Nu Aspect','','Nu Aspect'],['Dream',19,20,'JOA','','JOA'],['Dream',20,21,'Aaron Hibell','(live)','Aaron Hibell'],['Dream',21,22,'Alpha 9 + Ilan Bluestone','','Alpha 9 + Ilan Bluestone'],['Dream',22,23,'Ferry Corsten + Marsh','','Ferry Corsten + Marsh'],['Dream',23,25,'Above & Beyond','Anjunabeats Classics','Above & Beyond'],
['Sequence',16,17,'Barakuda','','Barakuda'],['Sequence',17,18,'Perfect Stranger','','Perfect Stranger'],['Sequence',18,19,'Rising Dust','','Rising Dust'],['Sequence',19,20,'Sighter','','Sighter'],['Sequence',20,21,'John 00 Fleming','','John 00 Fleming'],['Sequence',21,22,'Giorgia Angiuli','','Giorgia Angiuli'],['Sequence',22,23,'Vini Vici','','Vini Vici'],['Sequence',23,24,'Ace Ventura','','Ace Ventura'],['Sequence',24,25,'Animato','','Animato'],
['Void',16,17,'Hausman','Discovery Project','Hausman'],['Void',17,18,'Roman Messer','','Roman Messer'],['Void',18,19,'Parallel Worlds','','Parallel Worlds'],['Void',19,20,'Eddie Halliwell + Judge Jules','','Eddie Halliwell + Judge Jules'],['Void',20,21.25,'David Forbes + John Askew','','David Forbes + John Askew'],['Void',21.25,22.5,'Bryan Kearney + John O\'Callaghan','pres KEY4050','KEY4050'],['Void',22.5,23.75,'Aly & Fila + Billy Gillies','','Aly & Fila + Billy Gillies'],['Void',23.75,25,'Paul van Dyk','pres The Essence of Acid','Paul van Dyk'],
['Vision',16,17,'Sequence Six','','Sequence Six'],['Vision',17,18,'Maria Healy','','Maria Healy'],['Vision',18,19,'Chris Metcalfe','','Chris Metcalfe'],['Vision',19,20,'Andy Moor','','Andy Moor'],['Vision',20,21,'Allen Watts + Talla 2XLC','','Allen Watts + Talla 2XLC'],['Vision',21,22,'Darren Porter + Sean Tyas','','Darren Porter + Sean Tyas'],['Vision',22,23,'Cold Blue','','Cold Blue'],['Vision',23,24,'4 Strings','Classics set','4 Strings'],['Vision',24,25,'Solarstone','','Solarstone']]};
const $=id=>document.getElementById(id),au=$('au');const PX=78;
let day='Fri',mine=false,cur=-1,open=null,fav=new Set();
try{fav=new Set(JSON.parse(localStorage.getItem('ds26fav')||'[]'))}catch(e){}
try{if(/^#(fri|sat)$/i.test(location.hash))day=location.hash[1].toUpperCase()+location.hash.slice(2,4).toLowerCase()}catch(e){}
document.body.classList.add('dark');try{if(localStorage.getItem('ds26dark')==='0')document.body.classList.remove('dark')}catch(e){}
$('dm').textContent=document.body.classList.contains('dark')?'Light':'Dark';
function save(){try{localStorage.setItem('ds26fav',JSON.stringify([...fav]))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hh(h){const H=Math.floor(h),m=Math.round((h-H)*60),x=H%12||12;return x+(m?':'+String(m).padStart(2,'0'):'')}
function ap(h){return Math.floor(h)%24<12?'am':'pm'}
function range(s){return hh(s[1])+(ap(s[1])!==ap(s[2])?ap(s[1]):'')+'–'+hh(s[2])+ap(s[2])}
const key=(d,s)=>d+'|'+s[5];
const tracks=(d,s)=>R.map((r,i)=>i).filter(i=>R[i][0]===d&&R[i][2]===s[5]);
function art(r,z){return r[10]?IM+r[10]+'/'+z+'x'+z+'bb.jpg':''}
function sq(r){let t=r[4].replace(/\s*[\(\[](mixed|abgt\d+)[\)\]]/ig,'');return encodeURIComponent(r[3].split(/,| & | x /)[0]+' '+t)}
function draw(){
 document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===day));
 let g='<div class="hd"></div>'+STG.map(s=>'<div class="hd" style="color:var(--fg)">THE '+s.toUpperCase()+'</div>').join('');
 const H=(25-16)*PX;
 let ax='<div class="axis" style="height:'+H+'px">';for(let t=16;t<=25;t+=.5)ax+='<div class="tl" style="top:'+((t-16)*PX)+'px">'+hh(t)+(t%1?'':ap(t))+'</div>';ax+='</div>';
 g+=ax;
 for(const st of STG){g+='<div class="col" style="height:'+H+'px">';
  S[day].forEach((s,i)=>{if(s[0]!==st)return;const k=key(day,s),n=tracks(day,s).length,f=fav.has(k);
   g+='<button class="set '+st+(f?' fav':'')+(mine&&!f?' dim':'')+'" data-i="'+i+'" style="top:'+((s[1]-16)*PX+2)+'px;height:'+((s[2]-s[1])*PX-4)+'px"><span class="st">★</span><b>'+esc(s[3])+'</b>'+(s[4]?'<small>'+esc(s[4])+'</small>':'')+'<small>'+range(s)+'</small>'+(n?'<span class="n">♪'+n+'</span>':'')+'</button>'});
  g+='</div>'}
 $('g').innerHTML=g;
 plan()}
function plan(){$('pd').textContent=day==='Fri'?'Friday':'Saturday';
 const L=S[day].map((s,i)=>[s,i]).filter(([s])=>fav.has(key(day,s))).sort((a,b)=>a[0][1]-b[0][1]);
 if(!L.length){$('pl').innerHTML='<div class="empty">No sets starred yet. Tap a set, then ☆ I want to see this.</div>';return}
 $('pl').innerHTML=L.map(([s,i],j)=>{const clash=L.some(([o],k)=>k!==j&&o[1]<s[2]&&s[1]<o[2]);
  return '<div class="pi" data-i="'+i+'"><span class="dot '+s[0]+'"></span><div><div class="pt">'+esc(s[3])+'</div><div class="pm">'+range(s)+' · The '+s[0]+(s[4]?' · '+esc(s[4]):'')+'</div>'+(clash?'<div class="warn">Overlaps another set you starred</div>':'')+'</div></div>'}).join('')}
function openSet(i){const s=S[day][i];open=i;$('stt').textContent=s[3]+(s[4]?' '+s[4]:'');$('stm').textContent=(day==='Fri'?'Friday 11/20':'Saturday 11/21')+' · '+range(s)+' · The '+s[0];favBtn();
 const T=tracks(day,s);
 $('sl').innerHTML=T.length?T.map(i=>{const r=R[i];return '<div class="song">'+(r[10]?'<img class="art" loading="lazy" src="'+art(r,120)+'" alt="">':'<div class="art"></div>')+'<div class="mid"><div class="ti">'+esc(r[4])+(r[5]==='r'?'<span class="tag">remix</span>':r[5]==='f'?'<span class="tag">feat</span>':'')+'</div><div class="ar">'+esc(r[3])+'</div><div class="lk"><a class="am" target="_blank" rel="noopener" href="'+(r[8]?AM+r[8]:AM+'search?term='+sq(r))+'">Apple Music</a><a class="spt" target="_blank" rel="noopener" href="'+(r[11]?'https://open.spotify.com/track/'+r[11]:'https://open.spotify.com/search/'+sq(r))+'">Spotify</a></div></div><button class="play'+(i===cur&&!au.paused?' on':'')+'" data-t="'+i+'"'+(r[9]?'':' disabled')+'>'+(i===cur&&!au.paused?PAUSE:PLAY)+'</button></div>'}).join(''):'<p class="empty" style="padding:16px 0">No tracks from this artist in the library yet.</p>';
 $('sh').classList.add('on')}
function favBtn(){const s=S[day][open],f=fav.has(key(day,s));$('sfv').classList.toggle('on',f);$('sfv').textContent=f?'★ On my plan':'☆ I want to see this'}
function play(i){const r=R[i];if(!r[9])return;if(i===cur){au.paused?au.play().catch(()=>{}):au.pause();return}
 cur=i;au.src=AU+r[9];au.play().catch(()=>{});$('mini').style.display='flex';$('mimg').src=art(r,100);$('mt').innerHTML=esc(r[4])+'<span>'+esc(r[3])+'</span>';
 if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:r[4],artist:r[3],album:'Dreamstate SoCal 2026 · '+r[2],artwork:r[10]?[{src:art(r,512),sizes:'512x512',type:'image/jpeg'}]:[]})}catch(e){}}}
function sync(){document.querySelectorAll('.song .play').forEach(b=>{const on=+b.dataset.t===cur&&!au.paused;b.classList.toggle('on',on);b.innerHTML=on?PAUSE:PLAY});$('mpp').textContent=au.paused?'▶':'⏸'}
au.onplay=au.onpause=au.onended=sync;
$('g').addEventListener('click',e=>{const b=e.target.closest('.set');if(b)openSet(+b.dataset.i)});
$('pl').addEventListener('click',e=>{const b=e.target.closest('.pi');if(b)openSet(+b.dataset.i)});
$('sl').addEventListener('click',e=>{const b=e.target.closest('.play');if(b)play(+b.dataset.t)});
$('sx').onclick=()=>{$('sh').classList.remove('on');open=null};
$('sfv').onclick=()=>{const k=key(day,S[day][open]);fav.has(k)?fav.delete(k):fav.add(k);save();favBtn();draw()};
$('mpp').onclick=()=>{if(cur>=0)play(cur)};$('mx').onclick=()=>{au.pause();$('mini').style.display='none'};
$('mimg').onerror=function(){this.removeAttribute('src')};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{day=b.dataset.d;try{history.replaceState(null,'','#'+day.toLowerCase())}catch(e){}draw()});
$('mine').onclick=e=>{mine=!mine;e.target.classList.toggle('on',mine);draw()};
$('dm').onclick=e=>{const d=document.body.classList.toggle('dark');e.target.textContent=d?'Light':'Dark';try{localStorage.setItem('ds26dark',d?'1':'0')}catch(x){}};
draw();
</script></body></html>
